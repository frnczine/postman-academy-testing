$kind: http-request
description: Returns a list of airport codes
url: "{{baseUrl}}/airports?countryName=United States&airportCode=ATL"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: countryName
    value: United States
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "United States"
          }
        }
      }
  - key: airportCode
    value: ATL
    description: airport code
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "ATL",
            "minLength": 3,
            "maxLength": 4,
            "pattern": "^[A-Z]{3,4}$"
          }
        }
      }
auth:
  type: apikey
  credentials:
    key: x-api-key
    value: "{{apiKey}}"
    in: header
scripts:
  - type: afterResponse
    code: "const status = pm.response.json().status; \r

      const data = pm.response.json();\r

      \r

      if (pm.response.code === 200) {\r

      \    pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      pm.test(\"Content-Type is present\", function () {\r

      \    pm.response.to.have.header(\"Content-Type\");\r

      });\r

      pm.test(\"Response time is less than 200ms\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(200);\r

      });\r

      pm.test(\"Response created contains airport code ATL\", function () {\r

      \    var allCodes = [];\r

      \    data.forEach(function (country) {\r

      \        country.airports.forEach(function (airport) {\r

      \            allCodes.push(airport.code);\r

      \        });\r

      \    });\r

      \    pm.expect(allCodes).to.include(\"ATL\");\r

      });\r

      \    pm.test(\"Has required fields\", () => {\r

      \        data.forEach(function (country) {\r

      \            pm.expect(country).to.include.all.keys(\"country\", \"airports\");\r

      \            country.airports.forEach(function (airport) {\r

      \                pm.expect(airport).to.include.all.keys(\"code\", \"city\", \"name\");\r

      \            });\r

      \        });\r

      \    });\r

      \    pm.test(\"Airport code matches IATA format\", () => {\r

      \        const code = data[0].airports[0].code;\r

      \        pm.expect(code).to.match(/^[A-Z]{3}$/);\r

      \    });\r

      \    pm.test(\"Coordinates are numbers\", () => {\r

      \        const airport = data[0].airports[0];\r

      \        pm.expect(airport.latitude).to.be.a(\"number\");\r

      \        pm.expect(airport.longitude).to.be.a(\"number\");\r

      \    });\r

      \        pm.test(\"Coordinates are in valid range\", () => {\r

      \        const airport = data[0].airports[0];\r

      \        pm.expect(airport.latitude).to.be.within(-90, 90);\r

      \        pm.expect(airport.longitude).to.be.within(-180, 180);\r

      \r

      \    });\r

      \        pm.test(\"Response is grouped by country\", () => {\r

      \            pm.expect(data).to.be.an(\"array\");\r

      \            pm.expect(data[0]).to.have.property(\"country\");\r

      \            pm.expect(data[0].airports).to.be.an(\"array\");\r

      \        });\r

      \r

      } else if (pm.response.code === 404) {\r

      \    pm.test(\"Status code is 404\", () => {\r

      \        pm.response.to.have.status(404);\r

      });\r

      pm.test(\"Content-Type is problem+json\", () => {\r

      \    const ct = pm.response.headers.get(\"Content-Type\");\r

      \    pm.expect(ct).to.include(\"application/problem+json\");\r

      });\r

      pm.test(\"Body follows problemDetail schema\", () => {\r

      \    pm.expect(body).to.have.all.keys(\r

      \        \"type\", \"title\", \"status\",\r

      \        \"detail\", \"instance\", \"correlationId\"\r

      \    );\r

      \    pm.expect(body.status).to.equal(404);\r

      \    pm.expect(body.title).to.equal(\"Not Found\");\r

      });\r

      pm.test(\"detail is descriptive\", () => {\r

      \    pm.expect(data.detail).to.equal(\r

      \        \"No airport data found for the specified criteria\"\r

      \    );\r

      });\r

      }\r

      \    pm.test(\"Content-Type is present\", function () {\r

      \        pm.response.to.have.header(\"Content-Type\");\r

      \    });\r

      \r

      \    pm.test(\"Response time is less than 200ms\", function () {\r

