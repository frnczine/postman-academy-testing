$kind: http-request
description: Returns a list of METAR reports
url: "{{baseUrl}}/metars?airportCode=ATL"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: airportCode
    value: ATL
    description: airport code
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "ATL",
            "minLength": 3,
            "maxLength": 4,
            "pattern": "^[A-Z]{3,4}$"
          }
        }
      }
scripts:
  - type: afterResponse
    code: "const time = pm.response.responseTime;\r

      const name = pm.info.requestName;\r

      \r

      console.log(`[PERF] ${name}: ${time}ms`);\r

      if (time > 100) {\r

      \    console.warn(\r

      \        `[SLOW] ${name}: ${time}ms exceeds soft limit`\r

      \    );\r

      }\r

      pm.test(\"Response time is under 500ms\", () => {\r

      \    pm.expect(pm.response.responseTime)\r

      \        .to.be.below(500);\r

      });\r

      pm.test('Response size is under 10KB', () => {\r

      \    const sizeKB = pm.response.responseSize / 1024;\r

      \    pm.expect(sizeKB).to.be.below(10);\r

      });"
    language: text/javascript
settings: {}
examples: ./.resources/Retrieve METAR report.resources/examples
order: 1000
